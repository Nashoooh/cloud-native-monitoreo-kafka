# Aplicación
spring.application.name=monitorizacion-vehiculos
server.port=9200

# Oracle Cloud Database
spring.datasource.url=jdbc:oracle:thin:@u0g12ofrwn43uj0p_high?TNS_ADMIN=/app/wallet
spring.datasource.username=transporte
spring.datasource.password=Passw0rd1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Kafka
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=monitorizacion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Scheduling (Resumen diario automático)
spring.task.scheduling.enabled=true

# Modo producción (sin simulación)
app.simulacion.enabled=false

# Logs
logging.level.com.example.monitoreo_kafka=INFO
logging.level.org.springframework.kafka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
