# =========================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# =========================================================
spring.application.name=monitorizacion-vehiculos
server.port=8083

# =========================================================
# CONFIGURACIÓN ORACLE CLOUD DATABASE
# =========================================================
# Ruta para desarrollo local
spring.datasource.url=jdbc:oracle:thin:@u0g12ofrwn43uj0p_high?TNS_ADMIN=./Wallet
spring.datasource.username=transporte
spring.datasource.password=Passw0rd1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Para ejecución en AWS EC2 (producción) - descomentar y comentar la de arriba
#spring.datasource.url=jdbc:oracle:thin:@u0g12ofrwn43uj0p_high?TNS_ADMIN=/app/wallet
#spring.datasource.username=transporte
#spring.datasource.password=Passw0rd1234

# =========================================================
# CONFIGURACIÓN JPA / HIBERNATE
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# CONFIGURACIÓN KAFKA
# =========================================================
spring.kafka.bootstrap-servers=localhost:29092,localhost:39092,localhost:49092
spring.kafka.consumer.group-id=monitorizacion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# =========================================================
# CONFIGURACIÓN SCHEDULING (Para resumen diario)
# =========================================================
spring.task.scheduling.enabled=true

# =========================================================
# CONFIGURACIÓN MODO SIMULACIÓN
# =========================================================
# false = Inserta en BD real (Oracle Cloud)
# true = Solo simula con logs (para desarrollo sin BD)
app.simulacion.enabled=false

# =========================================================
# CONFIGURACIÓN DE LOGS
# =========================================================
logging.level.com.example.monitoreo_kafka=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ===============================
# Scheduled Tasks (Resumen Diario)
# ===============================
spring.task.scheduling.enabled=true

# ===============================
# Modo de Operación
# ===============================
# false = Inserta en BD real (Oracle Cloud)
# true = Solo simula con logs (para desarrollo sin BD)
app.simulacion.enabled=false

