spring.application.name=monitorizacion-vehiculos
server.port=8083

# ===============================
# Kafka Configuration
# ===============================
spring.kafka.bootstrap-servers=localhost:29092,localhost:39092,localhost:49092
spring.kafka.consumer.group-id=monitorizacion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# JSON Deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===============================
# Database Configuration - Oracle Cloud
# ===============================
# IMPORTANTE: El Wallet debe estar en la carpeta ./Wallet/ en la raíz del proyecto
# Para ejecución local (sin Docker):
spring.datasource.url=jdbc:oracle:thin:@u0g12ofrwn43uj0p_high?TNS_ADMIN=./Wallet
spring.datasource.username=transporte
spring.datasource.password=Passw0rd1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Para Docker (descomentar si usas Docker):
#spring.datasource.url=jdbc:oracle:thin:@u0g12ofrwn43uj0p_high?TNS_ADMIN=/app/wallet

# ===============================
# JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ===============================
# Scheduled Tasks (Resumen Diario)
# ===============================
spring.task.scheduling.enabled=true

# ===============================
# Modo de Operación
# ===============================
# true = Simula inserciones con logs (para desarrollo sin BD)
# false = Inserta en BD real (cuando tengas acceso a Oracle)
app.modo.simulacion=false

# ===============================
# Logging
# ===============================
logging.level.com.example.monitoreo_kafka=INFO
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
